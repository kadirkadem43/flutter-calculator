name: calculator_app
description: "A professional, production-ready premium mobile calculator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Precision Math (for preventing floating point errors in basic ops)
  decimal: ^3.0.2

  # Storage (Hive chosen for speed & simplicity for history; Isar is too heavy for just one model)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  
  # Localization & Formatting
  intl: ^0.19.0
  
  # Typography & Design
  google_fonts: ^6.2.1
  
  # Monetization
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Hive generator for type adapters
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true
